name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-acceptance:
    name: Build and PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTCONTAINERS_ENABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore OrderService.slnx

      - name: Build Release
        run: dotnet build OrderService.slnx --configuration Release --no-restore --nologo

      - name: Run PostgreSQL acceptance suite
        run: >-
          dotnet test tests/OrderService.IntegrationTests/OrderService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --nologo
          --logger "trx;LogFileName=postgresql-acceptance.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-acceptance-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
