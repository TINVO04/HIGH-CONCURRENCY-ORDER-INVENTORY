services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderservice}
      POSTGRES_USER: ${POSTGRES_USER:-orderservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderservice_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: ${CONNECTIONSTRINGS__POSTGRESQL:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderservice};Username=${POSTGRES_USER:-orderservice};Password=${POSTGRES_PASSWORD:-orderservice_dev_only}}
      TESTCONTAINERS_ENABLED: ${TESTCONTAINERS_ENABLED:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
